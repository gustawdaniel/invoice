server {
    listen 80;
    root /usr/share/nginx/html;
    # the root is a directory: it gets the app shell as its index
    index 200.html;

    # hashed assets never change
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # a single page app: every path that is not a file gets the shell (there is no index.html),
    # the browser routes it
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /200.html;
    }
}
