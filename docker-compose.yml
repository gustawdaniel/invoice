services:
  backend:
    image: registry.preciselab.space/open-invoice-backend:latest
    build: ./back
    ports:
      - "8493:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI
      - JWT_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - SPACE_ACCESS_KEY
      - SPACE_SECRET_KEY
      - SPACE_BUCKET
      - SPACE_ENDPOINT
      - SPACE_REGION
      - EXCHANGE_RATES_API_TOKEN
      - KSEF_SECRET_KEY
      - ADMIN_EMAILS
    restart: always

  frontend:
    image: registry.preciselab.space/open-invoice-front:latest
    build:
      context: ./web
      args:
        - VITE_API_URL
        - VITE_GOOGLE_CLIENT_ID=244384199602-sqhor9mc08tkl3gkd71k9c46rq38msdd.apps.googleusercontent.com
    ports:
      - "7482:80"
    depends_on:
      - backend
    restart: always
